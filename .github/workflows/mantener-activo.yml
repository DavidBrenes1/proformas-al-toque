# Mantiene activo el proyecto gratis de Supabase: si pasa 7 días sin uso, Supabase lo pausa.
# Corre todos los días y hace una consulta mínima que no toca datos de la app.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 * * *"   # todos los días, 7:17 a. m. hora de Costa Rica
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          # Clave pública (la misma que usa la página); solo puede llamar a ping().
          SUPABASE_URL: https://kucqzehqpioihymqpbls.supabase.co
          SUPABASE_KEY: sb_publishable_9CDsBvaqjf8JDV9GSHhgJg_f3gWNNOI
        run: |
          code=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat respuesta.txt)"
          test "$code" = "200"
