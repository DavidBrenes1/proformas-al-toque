<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proformas al Toque</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232753c9%22/%3E%3Cpath d=%22M10 7h8l5 5v13H10z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.2%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* VOICE: calm, quick shop-counter tool; everything one tap away, numbers always visible.
   IDEA: a fabrication order pad — a job moves through three tickets: client, equipment, review.
   PICTURE: the working app itself; the live proforma sheet is the hero of the last step.
   COLOUR and TYPE: white work surfaces on a cool steel ground, one cobalt accent from the company band; Geist throughout, tabular figures.
   LAYOUT: left rail on desktop, bottom tab bar on phones; editor is a 3-step wizard with a sticky total bar. */
:root{color-scheme:light dark;
  --bg:light-dark(#eef1f4,#0e1013);--panel:light-dark(#ffffff,#171a1f);--sunk:light-dark(#f4f6f8,#1c2026);--hover:light-dark(#eef1f5,#222730);
  --ink:light-dark(#121519,#eef1f5);--muted:light-dark(#5d6573,#9aa3b0);--line:light-dark(#e1e5ea,#2a3038);--line2:light-dark(#cdd3db,#3a414b);
  --accent:light-dark(#2753c9,#86a5ff);--accent-ink:light-dark(#ffffff,#0b1020);--accent-soft:light-dark(#e7edfc,#1d2846);
  --ok:light-dark(#1d7a49,#62c992);--ok-soft:light-dark(#e2f4ea,#16301f);--warn:light-dark(#975a00,#e8ac55);--warn-soft:light-dark(#fbf0db,#382a12);
  --bad:light-dark(#b42f26,#f2897f);--bad-soft:light-dark(#fbe5e3,#3c1c1a);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--r:14px;--r2:10px;
  --safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(24px,3vw,32px);line-height:1.1;font-weight:650}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:20px 14px;padding-top:max(20px,env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand .mark svg{width:18px;height:18px;stroke-width:2.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:var(--r2);cursor:pointer;color:var(--muted);font-weight:500;text-align:left;min-height:44px}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .grow{flex:1}
.rail .new{margin:8px 2px 0}
.main{padding:28px clamp(16px,3vw,40px) 120px;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));max-width:1240px;width:100%}
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:calc(110px + var(--safe-b))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + var(--safe-b)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);padding:6px 2px;border-radius:10px;min-height:52px;cursor:pointer}
  .tabbar button[aria-current=page]{color:var(--accent)}
  body.editing .tabbar{display:none}
}

/* building blocks */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.lg{min-height:50px;padding:0 22px;font-size:16px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font-weight:550;cursor:pointer;padding:6px 4px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:clamp(16px,2vw,22px)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-h p{margin-top:6px}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);padding:10px 12px;font-size:16px}
textarea{min-height:96px;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span,.f>.label{font-size:13.5px;font-weight:550;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:42px}
.search.big input{min-height:54px;font-size:17px;border-radius:var(--r)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:0 14px;min-height:36px;font-size:14px;font-weight:500;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.enviada{background:var(--accent-soft);color:var(--accent)}
.chip.aceptada{background:var(--ok-soft);color:var(--ok)}
.chip.rechazada{background:var(--bad-soft);color:var(--bad)}
.chip.ex{background:var(--warn-soft);color:var(--warn)}
.chip.ex::before,.chip.plain::before{display:none}
.banner{border-radius:var(--r2);padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:18px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-bottom:22px}
.hero-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:640px){.hero-actions{grid-template-columns:minmax(0,1fr)}}
.act{display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:20px;cursor:pointer;box-shadow:var(--shadow);min-height:96px}
.act:hover{border-color:var(--line2)}
.act .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.act .ic svg{width:24px;height:24px}
.act b{display:block;font-size:17px;font-weight:600}
.act small{color:var(--muted)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.primary small{color:inherit;opacity:.85}
.act.primary .ic{background:rgba(255,255,255,.18);color:inherit}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .k{font-size:13.5px;color:var(--muted);font-weight:500}
.stat .v{font-size:clamp(22px,2.6vw,28px);font-weight:650;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.stat .s{font-size:13px;color:var(--muted)}
.stat.hl .v{color:var(--ok)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 10px;border-radius:var(--r2);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.prow+.prow{border-top:1px solid var(--line)}
.prow:hover{background:var(--hover)}
.pnum{font-weight:600;font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 8px;color:var(--muted)}
.pmain b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmain small{color:var(--muted)}
.pend{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pamt{font-weight:600;white-space:nowrap}
.toplist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 4px}
.trow+.trow{border-top:1px solid var(--line)}
.thumb{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:#9aa3af;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain}
.trow b{font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* proformas list */
.plist .prow{grid-template-columns:auto minmax(0,1fr) auto auto;padding:14px 12px}
.plist .dup{opacity:.8}
@media (max-width:640px){.plist .prow{grid-template-columns:auto minmax(0,1fr) auto}.plist .dup{display:none}}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1 1 260px;max-width:420px}

/* inventory */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ecard .bd{padding:10px 12px 12px}.ecard .ft{flex-direction:column;align-items:flex-start}}
.ecard{display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.ecard:hover{border-color:var(--line2)}
.ecard .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--line);color:#9aa3af;font-size:13px}
.ecard .ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.ecard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.ecard .cat{font-size:12.5px;color:var(--muted);font-weight:500}
.ecard .nm{font-weight:600;line-height:1.3}
.ecard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.ecard .pr{font-weight:650}

/* clients */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;padding:16px;font:inherit;color:inherit}
.ccard:hover{border-color:var(--line2)}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;flex:none}
.ccard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard small{color:var(--muted);display:block}
.ccard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ccard .ck{margin-left:auto;color:var(--accent)}

/* editor */
.ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ed-title{margin-right:auto}
.ed-title h1{font-size:clamp(22px,2.6vw,28px)}
.ed-title .muted{font-size:13.5px}
select.pill{width:auto;min-height:40px;border-radius:999px;padding:0 34px 0 14px;font-size:14px;font-weight:550}
.steps{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);padding:10px 12px;cursor:pointer;font-weight:550;color:var(--muted);min-height:50px;text-align:left}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:650;background:var(--sunk);flex:none}
.steps .on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.steps .on .n{background:var(--accent);color:var(--accent-ink)}
.steps .done{color:var(--ink)}
.steps .done .n{background:var(--ok-soft);color:var(--ok)}
.steps .n svg{width:15px;height:15px;stroke-width:2.6}
@media (max-width:560px){.steps .lbl{display:none}.steps .lbl.cur{display:inline}.steps button{justify-content:center}.hide-s{display:none}.ed-bar .row{flex-wrap:nowrap}.ed-bar .btn.lg{padding:0 16px}.ed-head .btn.sm{padding:0 10px}}
.cli-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.eq-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.eq-layout{grid-template-columns:minmax(0,1fr)}}
.catalog{position:sticky;top:16px}
@media (max-width:980px){.catalog{position:static}}
.cat-list{display:flex;flex-direction:column;gap:6px;max-height:min(62vh,640px);overflow:auto;margin-top:12px;padding-right:2px}
.cat-item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);padding:8px;cursor:pointer;text-align:left;position:relative}
.cat-item:hover{border-color:var(--accent);background:var(--sunk)}
.cat-item .thumb{width:52px;height:52px}
.cat-item b{display:block;font-weight:550;line-height:1.3}
.cat-item small{color:var(--muted)}
.cat-item .add{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cat-item .cnt{position:absolute;top:-7px;left:44px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.line{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--panel)}
.line+.line{margin-top:12px}
.line .thumb{width:64px;height:64px}
.line .fields{display:flex;flex-direction:column;gap:10px}
.line .nm{font-weight:600}
.line textarea{min-height:110px;font-size:15px}
.line .nums{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:end}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;height:44px}
.qty button{width:40px;height:100%;border:0;background:var(--sunk);cursor:pointer;font-size:18px;font-weight:600}
.qty input{width:52px;border:0;border-radius:0;text-align:center;min-height:0;height:100%;padding:0}
.qty input:focus{box-shadow:none}
.line .sub{font-weight:650;white-space:nowrap;padding-bottom:10px;text-align:right}
.line .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.line .meta .acts{display:flex;gap:4px}
.hint button{border:0;background:none;color:var(--accent);font-weight:550;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
@media (max-width:560px){.line{grid-template-columns:minmax(0,1fr)}.line .thumb{display:none}.line .nums{grid-template-columns:auto minmax(0,1fr)}.line .sub{grid-column:1/-1;text-align:left;padding:0}}
.lines-empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.lines-empty b{display:block;color:var(--ink);margin-bottom:4px}
.rev{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.rev{grid-template-columns:minmax(0,1fr)}}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;cursor:pointer;font-size:14px;font-weight:550;padding:0 8px;text-align:center}
.seg label+label{border-left:1px solid var(--line2)}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.totals{display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.totals .grand{font-weight:700;font-size:20px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.paper{display:flex;flex-direction:column;gap:16px}
.paper svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(16,24,40,.10);border:1px solid var(--line)}
.ed-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.06)}
.ed-bar-in{max-width:1240px;margin-left:240px;padding:12px max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px)) calc(12px + var(--safe-b)) max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (max-width:820px){.ed-bar-in{margin-left:0}}
.ed-bar .tot small{display:block;color:var(--muted)}
.ed-bar .tot b{font-size:clamp(18px,2.4vw,22px);font-weight:700;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums}

/* login */
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.login .box{width:min(420px,100%);padding:32px 28px}
.login .brand{padding:0 0 22px}
.login h1{font-size:26px;margin-bottom:6px}
.login form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.login .err{background:var(--bad-soft);color:var(--bad);border-radius:var(--r2);padding:10px 12px;font-weight:500;font-size:14px}
.who{border-top:1px solid var(--line);padding:12px 6px 4px;margin-top:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sheet (dialog) */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);width:min(560px,100vw);max-width:100vw;height:100vh;max-height:100vh;margin:0 0 0 auto;border-radius:18px 0 0 18px;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(10,14,20,.42)}
@media (max-width:640px){dialog{width:100vw;height:auto;max-height:92vh;margin:auto 0 0;border-radius:18px 18px 0 0}}
dialog form{display:flex;flex-direction:column;height:100%;max-height:inherit}
dialog .dh{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
dialog .dh .label{font-size:13px;color:var(--muted);font-weight:500}
dialog .db{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
dialog .df{padding:14px 22px calc(14px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
dialog .df .left{margin-right:auto}
.photo-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-in .pv{width:110px;height:110px;border:1.5px dashed var(--line2);border-radius:var(--r2);display:grid;place-items:center;overflow:hidden;background:#fff;color:#8a929c;font-size:13px;flex:none}
.photo-in .pv img{width:100%;height:100%;object-fit:contain}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:550;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
body.editing .toast{bottom:calc(96px + var(--safe-b))}
@media (max-width:820px){.toast{bottom:calc(84px + var(--safe-b))}}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .22s ease-out}
  @keyframes in{from{opacity:.85;transform:translateY(4px)}to{opacity:1;transform:none}}
  .btn,.act,.cat-item,.ecard,.ccard{transition:background-color .15s,border-color .15s,filter .15s}
}
</style>
</head>

function readImage(file,max=320,keepPng=false){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const x=c.getContext("2d");
        const png = keepPng && /png|svg/.test(file.type);
        if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);}
        x.drawImage(img,0,0,c.width,c.height); res(png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.82)); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

}

/* ---------- shared rows ---------- */
function stats(){
  const now=new Date(), ym=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const mes=S.proformas.filter(p=>(p.fecha||"").startsWith(ym));
  const timed=S.proformas.filter(p=>+p.tiempoSeg>0);
  const avg=timed.length?timed.reduce((a,p)=>a+(+p.tiempoSeg),0)/timed.length:0;
  const antes=(+E().minutosAntes||40)*60;
  const ahorro=timed.length?Math.max(0,antes-avg)*mes.filter(p=>+p.tiempoSeg>0).length/3600:0;
  return {mes:mes.length, monto:mes.reduce((a,p)=>a+totals(p).total,0), acept:mes.filter(p=>p.estado==="aceptada").length, avg, timed:timed.length, ahorro};
}
function statsHtml(){
  const s=stats();
  return `<div class="stats">
    <div class="card stat"><div class="k">Proformas este mes</div><div class="v">${s.mes}</div><div class="s">${plural(s.acept,"aceptada","aceptadas")}</div></div>
    <div class="card stat"><div class="k">Monto cotizado</div><div class="v">${money(s.monto).replace(/\.\d\d$/,"")}</div><div class="s">este mes</div></div>
    <div class="card stat"><div class="k">Tiempo por proforma</div><div class="v">${s.timed?mins(s.avg):"—"}</div><div class="s">antes: ${E().minutosAntes||40} min a mano</div></div>
    <div class="card stat hl"><div class="k">Tiempo ahorrado</div><div class="v">${s.timed?s.ahorro.toFixed(1)+" h":"—"}</div><div class="s">este mes, medido por la app</div></div>
  </div>`;
}
const chipEstado=p=>`<span class="chip ${esc(p.estado||"borrador")}">${esc((p.estado||"borrador").replace(/^./,c=>c.toUpperCase()))}</span>`;
function rowP(p,withDup){
  const c=p.cliente||{}, n=(p.lineas||[]).length;
  return `<div class="prow" role="button" tabindex="0" data-open="${esc(p.id)}">
    <span class="pnum">${esc(p.numero)}</span>
    <span class="pmain"><b>${esc(c.nombre||"Sin cliente")}</b><small>${fdate(p.fecha)} · ${plural(n,"equipo","equipos")}${p.prueba?" · prueba":""}</small></span>

function bindRows(root=document){
  root.querySelectorAll("[data-open]").forEach(r=>{

    r.onclick=open; r.onkeydown=ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); open(ev);} };
  });
  root.querySelectorAll("[data-dup]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const p=S.proformas.find(x=>x.id===b.dataset.dup); p&&openEditor(p,true); });

/* ---------- Editor (3-step wizard) ---------- */
let D=null, timerInt=null, lastAct=0, isDup=false, step=1, catQ="", catCat="", cliQ="";
function openEditor(p,dup){
  isDup=!!dup;
  if(!p){ D={id:uid("p"),numero:nextNumero(),fecha:today(),clienteId:"",cliente:null,lineas:[],transporte:0,ivaModo:"incluido",notas:"",estado:"borrador",validezDias:E().validezDias,tiempoSeg:0,nuevo:true}; }
  else if(dup){ D=JSON.parse(JSON.stringify(strip(p))); Object.assign(D,{id:uid("p"),numero:nextNumero(),fecha:today(),clienteId:"",cliente:null,estado:"borrador",tiempoSeg:0,stockDescontado:false,nuevo:true,origen:p.numero}); delete D.prueba; }
  else { D=JSON.parse(JSON.stringify(p)); D.nuevo=false; }
  step = p&&!dup ? 3 : 1; catQ=""; catCat=""; cliQ="";
  D.sesionSeg=0; S.editing=true; lastAct=Date.now(); document.body.classList.add("editing");
  drawNav(); drawEditor(); window.scrollTo(0,0);
  clearInterval(timerInt);
  timerInt=setInterval(()=>{ if(D && document.visibilityState==="visible" && Date.now()-lastAct<90000){ D.sesionSeg++; const t=$("#edTimer"); t&&(t.textContent=fmtClock((+D.tiempoSeg||0)+D.sesionSeg)); } },1000);
}
function closeEditor(){ clearInterval(timerInt); S.editing=false; D=null; document.body.classList.remove("editing"); const b=$(".ed-bar"); b&&b.remove(); }
function goStep(n){
  if(n>1 && !D.clienteId){ toast("Elegí un cliente primero."); n=1; }
  if(n===3 && !D.lineas.length){ toast("Agregá al menos un equipo."); n=2; }
  step=n; drawEditor(); window.scrollTo(0,0);
}
function drawEditor(){
  const names=["Cliente","Equipos","Revisar"];
  $("#app").innerHTML=`<div class="view">
   <div class="ed-head">
     <button class="btn ghost" id="edBack">${icon("back")}Salir</button>
     <div class="ed-title"><h1>Proforma ${esc(D.numero)}</h1><span class="muted">${D.nuevo?"Sin guardar":"Guardada"} · tiempo <span class="timer" id="edTimer">${fmtClock(+D.tiempoSeg||0)}</span></span></div>
     <select class="pill" id="edEstado" aria-label="Estado">${ESTADOS.map(s=>`<option value="${s}" ${D.estado===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select>
     ${D.nuevo?"":`<button class="btn ghost sm" id="edDup">${icon("copy")}Duplicar</button><button class="btn ghost sm danger" id="edDel">${icon("trash")}Borrar</button>`}
     <button class="btn" id="edSave">Guardar</button>
   </div>
   ${isDup&&D.origen?`<div class="banner info">Copia de la proforma ${esc(D.origen)}. Elegí el cliente y revisá medidas y precios.</div>`:""}
   <ol class="steps">${names.map((s,i)=>{const n=i+1,cls=step===n?"on":step>n?"done":"";return `<li><button data-step="${n}" class="${cls}" ${step===n?'aria-current="step"':""}><span class="n">${step>n?icon("check"):n}</span><span class="lbl${step===n?" cur":""}">${s}</span></button></li>`}).join("")}</ol>
   <div id="stepBody">${[stepCliente,stepEquipos,stepRevisar][step-1]()}</div>
  </div>`;

    lines.forEach((s,i)=>T(s,BX+1.8,y+HH+3.6+i*LH,{size:9.2}));
    T(String(l.cantidad),(x1+x2)/2,y+HH+3.7,{font:"carlito",size:10,align:"center"});
    if(d) fit(f,x2+2,y+HH+1,C2-4,Math.min(32,bodyH-2));
    let py=y+HH+bodyH;
    prs.forEach(([a,b])=>{ R(BX,py,C0,PR,{fill:grey}); R(x1,py,C1,PR); R(x2,py,C2,PR);
      T(a,(x1+x2)/2,py+3.3,{font:"carlito",style:"bold",size:9,align:"center"}); T(b,(x2+x3)/2,py+3.3,{font:"carlito",style:"bold",size:9,align:"center"}); py+=PR; });
    y=py+4;
  });
  // totals
  const tl=[["SUBTOTAL",money(t.sub)]]; if(t.tr) tl.push(["transporte",money(t.tr)]); if(sumar) tl.push([`IVA ${e.ivaPct}%`,money(t.iva)]); tl.push(["TOTAL",money(t.total)+suf]);
  const RH=3.8, SP=2.6, G=1.6;
  if(y+tl.length*RH+(tl.length-1)*(SP+2*G)+2>bottom) y=newPage();
  y+=1;
  tl.forEach(([a,b],i)=>{ R(BX,y,BW,RH); L(x1,y,x1,y+RH); L(x2,y,x2,y+RH);
    T(a,(x1+x2)/2,y+2.75,{font:"carlito",style:"bold",size:7.6,align:"center"}); T(b,(x2+x3)/2,y+2.75,{font:"carlito",style:"bold",size:7.6,align:"center"});
    y+=RH; if(i<tl.length-1){ y+=G; R(BX,y,BW,SP); y+=SP+G; } });
  y+=8.5;
  // conditions
  const dias=String(p.validezDias??e.validezDias);
  const cond=[(e.condiciones||"").replace(/\{dias\}/g,dias), p.notas].filter(Boolean).join("\n");
  const line=(s,font,style,size,x)=>{ if(y>bottom){ y=newPage()+4; } T(s,x,y,{font,style,size}); y+=3.85; };
  wrap(cond,"helvetica","normal",8,186).forEach(s=>line(s,"helvetica","normal",8,15));
  // payment details: plain lines before the first *bold* line use the body face, the bank blocks use the serif face
  let firstBold=null, seenBold=false;
  (e.banco||"").split("\n").forEach(raw=>{
    const m=/^\s*\*(.+)\*\s*$/.exec(raw); if(m) seenBold=true;
    if(!raw.trim()){ y+=3.85; return; }
    if(m){ if(firstBold===null){ if(y>bottom-30){ y=newPage()+4; } firstBold={y,page:pages.length-1}; } wrap(m[1],"caladea","bold",9,80).forEach(s=>line(s,"caladea","bold",9,15)); }
    else if(!seenBold) wrap(raw,"helvetica","normal",8,186).forEach(s=>line(s,"helvetica","normal",8,15));
    else wrap(raw,"caladea","normal",9,80).forEach(s=>line(s,"caladea","normal",9,15));
  });
  if(e.cierreImagen&&DIMS.get(e.cierreImagen)){
    const top=firstBold?firstBold.y-13:y; const pg=firstBold?pages[firstBold.page]:ops;
    const save=ops; ops=pg; fit(e.cierreImagen,95,Math.max(60,top),82,42,"left"); ops=save;
  }
  // footer on every page; the colored rule sits above the last page's footer, as in the template
  const foot=e.pie||[e.telefonos&&("Teléfono: "+e.telefonos),e.correo&&("Correo electrónico: "+e.correo)].filter(Boolean).join(" * ");
  pages.forEach((pg,i)=>{ ops=pg;
    if(i===pages.length-1) R(0,239.4,W,2.2,{fill:band,stroke:false});
    foot&&T(foot,W/2,250,{font:"times",size:10.5,align:"center"});
    if(pie) fit(e.pieImagen,15,255.3,186,13); });
  return pages;
}
function drawToPdf(doc,pages){
  pages.forEach((ops,i)=>{ if(i>0) doc.addPage();
    ops.forEach(o=>{
      if(o.t==="text"){ doc.setFont(o.font,o.style); doc.setFontSize(o.size); doc.setTextColor(0,0,0); doc.text(o.s,o.x,o.y,o.align==="left"?undefined:{align:o.align}); }
      else if(o.t==="rect"){ doc.setLineWidth(o.lw); doc.setDrawColor(0,0,0); if(o.fill) doc.setFillColor(...hex(o.fill)); doc.rect(o.x,o.y,o.w,o.h,o.fill&&o.stroke?"FD":o.fill?"F":"S"); }
      else if(o.t==="line"){ doc.setLineWidth(o.lw); doc.setDrawColor(0,0,0); doc.line(o.x1,o.y1,o.x2,o.y2); }
      else if(o.t==="img"){ try{ const im=DATA.get(o.src)||o.src; doc.addImage(im,fmtOf(im),o.x,o.y,o.w,o.h,undefined,"FAST"); }catch(_){} }
    }); });
}
const SVGFONT={helvetica:"Arial,'Liberation Sans',Helvetica,sans-serif",times:"'Times New Roman','Liberation Serif',Times,serif",carlito:"CarlitoE,Calibri,sans-serif",caladea:"CaladeaE,Cambria,serif"};
function drawToSvg(pages){
  const PT=25.4/72;
  return pages.map(ops=>`<svg viewBox="0 0 215.9 279.4" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Página de la proforma"><rect width="215.9" height="279.4" fill="#ffffff"/>${ops.map(o=>{
    if(o.t==="text") return `<text x="${o.x}" y="${o.y}" font-family="${SVGFONT[o.font]}" font-weight="${o.style==="bold"?700:400}" font-size="${(o.size*PT).toFixed(3)}" text-anchor="${o.align==="center"?"middle":o.align==="right"?"end":"start"}" fill="#000" xml:space="preserve">${esc(o.s)}</text>`;
    if(o.t==="rect") return `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="${o.fill||"none"}" ${o.stroke?`stroke="#000" stroke-width="${o.lw}"`:""}/>`;
    if(o.t==="line") return `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="#000" stroke-width="${o.lw}"/>`;
    if(o.t==="img") return `<image href="${esc(o.src)}" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" preserveAspectRatio="none"/>`;
    return ""; }).join("")}</svg>`).join("");
}
let prevTimer=null, prevSeq=0;
function schedulePreview(){ clearTimeout(prevTimer); prevTimer=setTimeout(renderPreview,120); }
async function renderPreview(){
  const box=$("#paper"); if(!box||!D) return; const seq=++prevSeq;
  const doc=measureDoc(); if(!doc){ box.innerHTML=`<div class="hint" style="padding:20px">La vista previa necesita conexión para cargar. Recargá la página.</div>`; return; }
  await preloadImages(D); if(seq!==prevSeq||!D) return;
  try{ box.innerHTML=drawToSvg(layoutProforma(doc,D)); }catch(err){ box.innerHTML=`<div class="hint" style="padding:20px">No se pudo dibujar la vista previa.</div>`; }
}
/* ---------- PDF ---------- */
async function downloadPdf(){
  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF. Revisá la conexión y recargá."); return; }
  if(!D.lineas.length){ toast("Agregá al menos un equipo."); return; }
  if(!D.clienteId){ toast("Elegí un cliente antes de descargar."); return; }
  const ok=await saveDraft(true); if(!ok) return;
  drawEditor();
  const p=D, c=clienteSnap()||{};
  await preloadImages(p);
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"letter"}); registerFonts(doc);
  drawToPdf(doc,layoutProforma(doc,p));
  const fname=`Proforma ${p.numero} - ${(c.nombre||"cliente").replace(/[\\/:*?"<>|]/g,"")}.pdf`;
  try{ const url=URL.createObjectURL(doc.output("blob")); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000); toast("PDF descargado"); }
  catch(_){ toast("No se pudo descargar el PDF."); }
}
function hex(h){ const m=/^#?([0-9a-f]{6})$/i.exec(h||""); if(!m) return [59,101,168]; const n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; }

/* ---------- boot ---------- */
let chan=null, rt=null, loginMsg="";
function rerender(){ clearTimeout(rt); rt=setTimeout(()=>{ if(!S.editing) render(); else if(D && !dlg.open){ try{ updateLive(); if(step===2 && !document.activeElement.closest(".catalog,.line")) drawCatalog(); }catch(_){} } },80); }
function applyChange(t,ev){
  if(t==="config"){ if(ev.new&&ev.new.id==="empresa") S.empresa=ev.new.data||{}; }
  else if(ev.eventType==="DELETE"){ const id=ev.old&&ev.old.id; S[t]=S[t].filter(x=>x.id!==id); }
  else if(ev.new){ upsertLocal(t,{id:ev.new.id,...ev.new.data}); }
  rerender();
}
async function loadAll(){
  const res=await Promise.all(["config","equipos","clientes","proformas"].map(t=>SB.from(t).select("id,data")));
  const bad=res.find(r=>r.error); if(bad) throw bad.error;
  const [c,e,cl,p]=res.map(r=>r.data);
  S.empresa=(c.find(r=>r.id==="empresa")||{}).data||{};
  S.equipos=e.map(r=>({id:r.id,...r.data})); S.clientes=cl.map(r=>({id:r.id,...r.data})); S.proformas=p.map(r=>({id:r.id,...r.data}));
}
function showLogin(msg){ const l=$("#login"); l.hidden=false; const e=$("#loginErr"); e.hidden=!msg; e.textContent=msg||""; setTimeout(()=>{ try{$("#lgEmail").focus();}catch(_){} },50); }
async function start(session){
  if(!session){ showLogin(loginMsg); loginMsg=""; return; }
  S.user=session.user; $("#whoEmail").textContent=session.user.email||"";
  const {data:m,error}=await SB.from("miembros").select("email").limit(1);
  if(!error && (!m||!m.length)){ loginMsg="Esta cuenta no tiene acceso a la app. Pedí que te den acceso."; await SB.auth.signOut(); return; }
  $("#login").hidden=true;
  try{ await loadAll(); S.db=SB; S.offline=false; }catch(_){ S.db=SB; S.offline=true; }
  render();
  if(!chan){ chan=SB.channel("cambios"); ["config","equipos","clientes","proformas"].forEach(t=>chan.on("postgres_changes",{event:"*",schema:"public",table:t},ev=>applyChange(t,ev))); chan.subscribe(); }
}
(function boot(){
  const h=(location.hash||"").slice(1); if(TABS.some(([k])=>k===h)) S.tab=h;
  render();
  $("#loginForm").onsubmit=async ev=>{ ev.preventDefault(); const btn=$("#lgBtn"); btn.disabled=true; btn.textContent="Entrando…";
    const {data,error}=await SB.auth.signInWithPassword({email:$("#lgEmail").value.trim(),password:$("#lgPass").value});
    btn.disabled=false; btn.textContent="Entrar";
    if(error){ showLogin(/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar: "+error.message); return; }
    $("#lgPass").value=""; start(data.session); };
  $("#railOut").onclick=()=>SB.auth.signOut();
  SB.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ if(S.editing) closeEditor(); if(chan){ SB.removeChannel(chan); chan=null; } S.db=null; S.user=null; S.equipos=[];S.clientes=[];S.proformas=[];S.empresa={}; render(); showLogin(loginMsg); loginMsg=""; } });
  SB.auth.getSession().then(({data})=>start(data.session));
})();
</script>
